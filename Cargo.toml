[workspace]
members = ["crates/flow_cache", "crates/flow_document", "crates/flow_publication"]
resolver = "3"

[workspace.lints.rust]
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
publish = ["crates-io"]
license = "MIT"
repository = "https://github.com/pgavlin/flow"

[workspace.dependencies]
flow_cache = { version = "0.3.0", path = "crates/flow_cache" }
flow_document = { version = "0.3.0", path = "crates/flow_document", default-features = false }
