[package]
name = "flow_publication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Format-neutral publications, host-driven reading sessions, and EPUB import"
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "examples/**", "benches/**", "README.md", "LICENSE"]
keywords = ["reading", "document", "epub", "typography"]
categories = ["text-processing", "rendering"]

[package.metadata.docs.rs]
features = ["render", "epub", "serde"]

[features]
default = []
epub = ["dep:quick-xml", "dep:zip"]
render = ["flow_document/render", "dep:anyhow"]
serde = ["flow_document/serde"]
telemetry = ["flow_document/telemetry"]

[lints]
workspace = true

[dependencies]
flow_cache.workspace = true
flow_document.workspace = true
anyhow = { version = "1", optional = true }
blake3 = "1"
quick-xml = { version = "0.41", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zip = { version = "7.3", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[example]]
name = "inspect_epub"
required-features = ["epub"]

[[bench]]
name = "opening"
harness = false
required-features = ["render"]

[[bench]]
name = "memory"
harness = false
required-features = ["render"]

[dev-dependencies]
dhat = "0.3.3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
flow_document = { workspace = true, features = ["render", "test-fonts"] }
