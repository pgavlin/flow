name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo lint --all

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - name: Build minimal workspace without warnings
        run: cargo build --locked --workspace --no-default-features
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo test --locked --workspace --features render
      - run: cargo test --locked -p flow_document --features render --example render_document
      - run: cargo test --locked -p flow_document --no-default-features
      - run: cargo test --locked -p flow_cache
      - run: cargo test --locked -p flow_publication --no-default-features
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify all packaged crates together
        run: cargo package --locked --workspace --all-features
      - name: Check crates.io upload sizes
        run: |
          for archive in target/package/*.crate; do
            bytes=$(wc -c < "$archive")
            echo "$archive: $bytes bytes"
            test "$bytes" -le 10000000
          done

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo +1.94.0 check --locked --workspace --all-targets --all-features

  reader:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: examples/reader -> target
      - run: cargo fmt --manifest-path examples/reader/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path examples/reader/Cargo.toml
      - run: cargo clippy --locked --manifest-path examples/reader/Cargo.toml --all-targets

  reader-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: examples/reader -> target
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: cargo build-web --dev
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
